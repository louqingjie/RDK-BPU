# 同济 sp_vision_25 tiny_resnet 数字分类器 -> RDK X5 (bayes-e) 量化编译配置
# 生成：2026-09-08
# 模型：data/onnx/sp_vision_25/sp25_tiny_resnet_b1.onnx
#       （自 tongji sp_vision_25 assets/tiny_resnet.onnx，动态 batch 固化为 1，
#         scripts/prepare_sp25_models.py；全 FP32 权重，55 节点纯 BPU 友好算子）
# 校准集：data/horizon_x5/data/calibration_data_32gray/（400 个 uint8 灰度 32x32 NCHW，
#         预处理对齐 classifier.cpp：等比缩放贴左上角 + 黑底 + /255）

model_parameters:
  onnx_model: '/workspace/data/onnx/sp_vision_25/sp25_tiny_resnet_b1.onnx'
  march: 'bayes-e'
  layer_out_dump: False
  working_dir: '/workspace/quant/sp25_tiny_resnet/model_output'
  output_model_file_prefix: 'sp25_tiny_resnet_32x32'

input_parameters:
  input_name: 'input'
  # 部署时喂 uint8 灰度，归一化（/255）由 BPU 内部完成
  input_type_rt: 'gray'
  input_layout_rt: 'NCHW'        # P4: gray 也必须显式指定
  input_type_train: 'gray'
  input_layout_train: 'NCHW'
  input_shape: '1x1x32x32'
  norm_type: 'data_scale'
  scale_value: 0.00392156862745098

calibration_parameters:
  cal_data_dir: '/workspace/data/horizon_x5/data/calibration_data_32gray/images'
  cal_data_type: 'uint8'
  calibration_type: 'default'

compiler_parameters:
  compile_mode: 'latency'
  debug: True
  optimize_level: 'O2'
